# Windows packaging for the MANUX desktop app. No code signing is configured.
appId: ai.intel7.manux
productName: MANUX
copyright: MANUX team
# asar is off on purpose: the PowerShell mouse helper must be a real file on disk that an
# external process can read, and server.js serves src/, public/ and node_modules by file path.
asar: false
directories:
  output: dist
files:
  - package.json
  - server.js
  - desktop/**
  - src/**
  - public/**
  - '!public/media/**'
  - '!**/*.map'
  - '!**/*.md'
win:
  target:
    - target: nsis
      arch: x64
  # Without signing there is nothing for winCodeSign to do; skipping it also avoids
  # a tool download that needs symlink rights on Windows.
  signAndEditExecutable: false
nsis:
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false
  artifactName: MANUX-Setup-${version}.${ext}
publish:
  provider: github
  owner: intel7-ai
  repo: manux
  # A draft release is not visible to installed apps until a person publishes it.
  releaseType: draft
