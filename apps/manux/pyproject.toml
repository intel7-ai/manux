[project]
name = "manux"
version = "0.4.0.dev0"
description = "MANUX v0.4: webcam hand control for Windows (Qt/QML + Python)"
readme = "README.md"
requires-python = ">=3.12"
# Added stage by stage (docs/architecture.md section 8). numpy is needed everywhere frames or
# features are handled. OpenCV and MediaPipe are imported lazily (only when a real camera or
# model is opened), so the tests and CI run without them.
dependencies = ["numpy>=2"]

[project.optional-dependencies]
vision = ["opencv-python>=5.0.0.93", "mediapipe>=1.2.0"]   # S1: real camera and hand tracking
test = ["pytest>=8"]                                        # CI: pip install -e ".[test]"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"
