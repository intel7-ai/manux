[project]
name = "hand-mouse"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Dan", email = "inpusanstation@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.5",
    "cryptography>=50.0.2",
    "mediapipe>=1.2.0",
    "numpy>=2.5.4",
    "opencv-python>=5.0.0.93",
    "pillow>=13.0.0",
    "pyautogui>=0.9.54",
    "pystray>=0.19.5",
    "pytest>=9.2.0",
    "qrcode>=8.2",
    "uiautomation>=2.0.29",
]

[project.scripts]
hand-mouse = "hand_mouse:main"

[project.optional-dependencies]
qt = [
    "pyside6-essentials>=6.8,<7",
]
train = [
    "onnx>=1.23.2",
    "onnxruntime>=1.31.1",
    "onnxscript>=0.7.2",
    "torch>=2.15.0",
]

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"
