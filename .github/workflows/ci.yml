name: MANUX CI
on:
  pull_request:
    branches-ignore: [testing, v0.5-testing] # local source integration; preview/production keep all gates
  push:
    branches: [main, master, preview, production]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: manux-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.base_ref == 'production' || github.ref == 'refs/heads/production' || github.event_name == 'workflow_dispatch') && '["windows-latest","ubuntu-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run doctor
      - run: npm run verify
      - name: Verification evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: verification-${{ matrix.os }}
          path: .local/verification/
          include-hidden-files: true
          retention-days: 7
  apps-manux:
    name: apps/manux (v0.4 structure and contracts)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/manux
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Python 3.12+ with MANUX and pytest
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet -e ".[test]"
      - run: '"$RUNNER_TEMP/venv/bin/python" -m pytest -q'
  required:
    name: MANUX required
    if: always()
    needs: [verify, apps-manux]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Current gates must pass
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          MANUX_RESULT: ${{ needs.apps-manux.result }}
        run: |
          test "$VERIFY_RESULT" = success
          test "$MANUX_RESULT" = success
      - name: production accepts PRs from preview only
        if: github.event_name == 'pull_request' && github.base_ref == 'production'
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          if [ "$HEAD_REF" != preview ] || [ "$HEAD_REPO" != "$BASE_REPO" ]; then
            echo "::error::production에는 preview 브랜치 PR만 병합합니다."
            exit 1
          fi
