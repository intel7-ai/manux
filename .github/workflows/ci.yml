name: MANUX CI

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manux-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run doctor
      - run: npm run verify
      - name: Windows helper protocol (dry-run, no real mouse input)
        if: runner.os == 'Windows'
        run: npm run test:native
      - name: Verification evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: verification-${{ matrix.os }}
          path: |
            .local/verification/latest.json
            .local/verification/verify.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  browser:
    name: Synthetic browser integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Browser evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: synthetic-browser-evidence
          path: test-results/air-mouse-*
          if-no-files-found: ignore
          retention-days: 7

  required:
    name: MANUX required
    if: always()
    needs: [verify, browser, windows-package]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every gate must pass
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          PACKAGE_RESULT: ${{ needs.windows-package.result }}
        run: test "$VERIFY_RESULT" = success && test "$BROWSER_RESULT" = success && test "$PACKAGE_RESULT" = success

  windows-package:
    name: Windows preview installer
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      MANUX_BUILD_CHANNEL: preview
      MANUX_PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run desktop:setup
      - run: node scripts/release-version.mjs prepare preview
      - run: npm run desktop:dist
      - run: npm run test:packaged
      - run: npm run test:update-download
      - name: Download the PR's preview app (never a stable update)
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: MANUX-preview-${{ github.event.pull_request.number || github.run_number }}-${{ github.sha }}
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14
      - name: Packaged app evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: preview-package-evidence
          path: |
            test-results/packaged-app.json
            test-results/update-download.json
          if-no-files-found: ignore
          retention-days: 7
